[package]
name = "space"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "space_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
parking_lot = "0.12"
# Win32 thread priority (below-normal scan workers) + native folder picker.
# Both are already in the lockfile via transitive deps, so no network fetch.
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
] }
rayon = "1.12"
rfd = "0.15"
# Preview families (FLEET_SPEC §B): raster thumbnails, archive central dirs,
# read-only sqlite schema, data-URL encoding.
image = "0.25"
zip = "2.2"
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22"

# jwalk (the non-Windows fallback walker) and dashmap (its path→id map) are
# only used on non-Windows builds — the Windows fast path enumerates with
# FindFirstFileExW directly and carries directory ids inline, so scoping these
# deps keeps the Windows build lean. (Target sections must come after the
# plain [dependencies] entries — TOML tables swallow everything below them.)
[target.'cfg(not(windows))'.dependencies]
jwalk = "0.8"
dashmap = "6"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# Unwind, NOT abort: the walker thread wraps its body in catch_unwind
# (scanner.rs) so a panic surfaces as scan://error instead of killing the
# process — abort would defeat that guard (FLEET_SPEC §C6).
panic = "unwind"
strip = true
