<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <title>plate test</title>
    <link rel="stylesheet" href="/src/index.css" />
    <style>
      html, body { margin: 0; background: #0b0b0d; }
      #stage { position: relative; width: 340px; height: 240px; margin: 12px; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script type="module">
      import { createPlate, fillPlate } from "/src/components/treemap/previewPlate.ts";
      const el = createPlate();
      el.hidden = false;
      el.style.setProperty("--tile-w", "313px");
      el.style.setProperty("--tile-h", "213px");
      document.getElementById("stage").append(el);
      fillPlate(
        el,
        {
          family: "LIST",
          list: {
            kind: "folder",
            total: 4809,
            entries: [
              { name: "DriverStore/", size: 3110000000, isDir: true },
              { name: "tbs/", size: 391000000, isDir: true },
              { name: "win evt/", size: 377000000, isDir: true },
              { name: "MiTEex/", size: 220000000, isDir: true },
              { name: "drivers/", size: 106000000, isDir: true },
              { name: "wbem/", size: 85600000, isDir: true },
            ],
          },
        },
        { tile: { w: 313, h: 213 }, theme: "dark", fileName: "System32", meta: { name: "System32", size: 3100000000 } }
      );
    </script>
  </body>
</html>
