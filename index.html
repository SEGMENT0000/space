<!doctype html>
<!-- The ground is set before the first paint: data-theme is resolved from
     the persisted choice (dark default) by this inline script, so the shell
     never flashes a foreign neutral while the bundle boots. The values match
     tokens.css --bg / canvasBg exactly. -->
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>space</title>
    <script>
      try {
        var t = localStorage.getItem("space.theme");
        document.documentElement.dataset.theme =
          t === "light" || t === "dark" ? t : "dark";
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
    <style>
      html {
        background: #0b0b0d;
      }
      html[data-theme="light"] {
        background: #f1f1f3;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
